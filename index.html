<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laura's Malaysia Challenge 🇲🇾</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;color:#253a32}body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px 14px;background:linear-gradient(135deg,#e1eee8,#fdf1e3 60%,#f3d7cb)}.card{position:relative;overflow:hidden;width:min(100%,480px);min-height:650px;background:#fffdf9;border:1px solid #f2e9e1;border-radius:26px;box-shadow:0 18px 60px #35534829;padding:26px 22px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}.eyebrow{font:700 10px system-ui;letter-spacing:2.5px;color:#718c77}.photo{height:235px;width:100%;object-fit:cover;object-position:center 40%;border-radius:17px;box-shadow:0 5px 20px #0001}.photo.square{height:210px;width:210px;object-position:center 30%}h1{font-size:clamp(30px,7.8vw,44px);line-height:1.1;font-weight:400;margin:6px 0 0}p{font:15px/1.55 system-ui;margin:0;color:#657269}.options{display:grid;gap:10px;width:100%;margin-top:10px}button{appearance:none;-webkit-appearance:none;touch-action:manipulation;cursor:pointer;border:1px solid #d7ded4;background:#fff;color:#324439;border-radius:13px;padding:15px 12px;min-height:53px;font:600 14px system-ui}.primary{background:#69896e;color:#fff;border-color:#69896e}.row{position:relative;display:flex;justify-content:space-around;align-items:center;width:100%;height:125px;margin-top:8px}.row button{width:43%}#no{position:absolute;left:55%;top:22px;transition:left .17s ease,top .17s ease;z-index:3}#yes{position:absolute;left:4%;top:22px}.hidden{display:none!important}.footer{font:11px system-ui;color:#929a8e;margin-top:auto}.tag{font:11px system-ui;letter-spacing:2px;color:#648267}.confetti{position:fixed;top:-20px;width:9px;height:15px;pointer-events:none;animation:fall 3s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}@media(max-height:720px){body{align-items:flex-start}.card{min-height:610px}.photo{height:190px}.photo.square{height:165px;width:165px}}
</style></head><body><main class="card"><div class="eyebrow" id="eyebrow">OFFICIAL INVITATION · MALAYSIA 2027</div><img class="photo" id="photo" src="IMG_0704.jpeg" alt="Urlaubsfoto"><h1 id="title">Laura, are you coming to Malaysia? ✈️</h1><p id="desc">23. März bis 4. April 2027<br>Abenteuer, Cocktails und fragwürdige Entscheidungen warten auf dich. 🍹</p><div id="choices" class="options hidden"></div><div id="initial" class="row"><button type="button" class="primary" id="yes">HELL YES! 🍹</button><button type="button" id="no">NO 🙄</button></div><div class="footer" id="footer">Eine Einladung, die du nicht ablehnen kannst. 😈</div></main><script>
(function(){'use strict';const e=id=>document.getElementById(id);const qs=[{title:'Wie bereit bist du für Malaysia? 🌴',photo:2,answers:['Mein Koffer ist gedanklich schon gepackt. 😍','Ich brauche erst mal einen Cocktail. 🍹','Ich überleg’s mir noch. 🤔'],bad:2},{title:'Was steht auf dem Programm? 🍹',photo:3,answers:['Jetski, Abenteuer und absolut fragwürdige Entscheidungen.','Cocktails, Strand und Eskalation.','Ich will nur im Hotelzimmer bleiben.'],bad:2},{title:'Was ist deine wichtigste Aufgabe? 😎',photo:1,answers:['Mit Lena Scheiße bauen.','Dafür sorgen, dass wir alle wieder heil nach Hause kommen.','Vernünftig sein.'],bad:2}];let step=0,escapes=0;function page(k,t,d,img){e('eyebrow').textContent=k;e('title').textContent=t;e('desc').innerHTML=d;e('photo').src=['','IMG_0704.jpeg','IMG_1054.jpeg','35bac113-aa1d-40ff-817e-1f5dc743eca1.jpeg'][img];';e('photo').classList.toggle('square',k!=='OFFICIAL INVITATION · MALAYSIA 2027');e('initial').classList.add('hidden');e('choices').classList.remove('hidden');e('choices').replaceChildren();e('footer').textContent='Malaysia Chaos Crew · 2027'}function button(t,fn,primary=false){const b=document.createElement('button');b.type='button';b.textContent=t;if(primary)b.className='primary';b.addEventListener('click',fn);e('choices').appendChild(b)}function question(i){step=i;let q=qs[i];page('QUESTION '+(i+1)+' OF 3',q.title,'Wähle mit Bedacht. Es gibt hier falsche Antworten. 😂',q.photo);q.answers.forEach((a,j)=>button(a,()=>j===q.bad?wrong():i===2?finish():question(i+1)))}function wrong(){page('WRONG ANSWER','TRY AGAIN, BITCH! 😈','Laura, diese Antwort akzeptieren wir leider nicht. 😂',2);button('OKAY, I’LL TRY AGAIN ↻',()=>question(step),true)}function finish(){page('GUEST STATUS: CONFIRMED','YOU PASSED! 🎉','Laura, you’re officially part of the Malaysia chaos crew! 🇲🇾<br><br>23.03. bis 04.04.2027<br>Pack deinen Koffer, Bitch! ❤️',3);button('Per WhatsApp feiern 💬',()=>{const msg=encodeURIComponent('Ich habe die Malaysia Challenge bestanden! 🇲🇾🥳 Malaysia Chaos Crew 2027! 🍹');window.location.href='https://wa.me/?text='+msg},true);button('Nochmal spielen ↻',()=>question(0));for(let i=0;i<85;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#69896e','#efaa9e','#f4d277','#a6c9dc'][i%4];c.style.animationDelay=Math.random()*1.8+'s';c.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}e('yes').addEventListener('click',()=>question(0));const no=e('no');function flee(ev){if(ev&&ev.cancelable)ev.preventDefault();escapes++;const row=e('initial');const maxX=Math.max(0,row.clientWidth-no.offsetWidth-8),maxY=Math.max(0,row.clientHeight-no.offsetHeight-5);let x=Math.random()*maxX,y=Math.random()*maxY;if(escapes%3===0){x=0;y=maxY}no.style.left=x+'px';no.style.top=y+'px'}no.addEventListener('pointerdown',flee);no.addEventListener('pointerenter',ev=>{if(ev.pointerType==='mouse')flee(ev)});no.addEventListener('click',flee);})();
</script></body></html>
